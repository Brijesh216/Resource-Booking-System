server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: resource-booking-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

# JWT configuration
jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long-please}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.booking: ${LOG_LEVEL:INFO}
